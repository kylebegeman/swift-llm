name: LLMShowcase
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
packages:
  SwiftLLMPackage:
    path: ../..
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  LLMShowcase:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LLMShowcase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LLMShowcase
        PRODUCT_NAME: LLMShowcase
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LLMShowcase
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: SwiftLLMPackage
        product: SwiftLLM
      - package: SwiftLLMPackage
        product: SwiftLLMFoundationModels
      - package: SwiftLLMPackage
        product: SwiftLLMOpenAI
      - package: SwiftLLMPackage
        product: SwiftLLMAnthropic
      - package: SwiftLLMPackage
        product: SwiftLLMEvaluation
schemes:
  LLMShowcase:
    build:
      targets:
        LLMShowcase: all
    run:
      config: Debug
    archive:
      config: Release
