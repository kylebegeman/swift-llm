name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - next

jobs:
  test:
    name: Swift Package
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate
        run: ./scripts/validate.sh
